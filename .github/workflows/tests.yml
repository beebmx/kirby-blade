name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, simplexml, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} · Kirby ${{ matrix.kirby }} · illuminate/view ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        kirby: ['4', '5', '6']
        laravel: ['12', '13']
        exclude:
          # Kirby 4 supports PHP up to 8.4
          - php: '8.5'
            kirby: '4'
          - php: '8.6'
            kirby: '4'
          # Kirby 5 supports PHP up to 8.5
          - php: '8.6'
            kirby: '5'
          # illuminate/view 12 triggers PHP 8.6 deprecations (spl_object_hash)
          - php: '8.6'
            laravel: '12'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, simplexml, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/view:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require "getkirby/cms:^${{ matrix.kirby }}.0" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
